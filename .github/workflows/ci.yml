name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and notebook validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately NOT the full requirements: the test suite must run
        # without torch, transformers or any model download. That constraint
        # is what keeps CI fast and the tests honest.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy

      - name: Lint
        run: ruff check src tests tools scripts

      - name: Run tests
        run: python -m pytest

      - name: Verify notebooks are in sync with their sources
        run: python tools/nbbuild.py --check

      - name: Verify diagrams are in sync with their generator
        run: python tools/make_diagrams.py --check

      - name: Validate notebook structure, syntax and links
        run: python tools/check_notebooks.py

      - name: Check documentation links
        run: python tools/check_links.py
