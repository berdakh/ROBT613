# GitHub Pages configuration for the ROBT407LLM Qwen workshop site.
#
# Published from the /docs folder. Two ways to serve it:
#   1. Settings -> Pages -> Source: "Deploy from a branch", branch: main, folder: /docs
#   2. Settings -> Pages -> Source: "GitHub Actions" (uses .github/workflows/pages.yml)

title: Open-Weight LLMs & Agentic AI
description: >-
  A four-day hands-on workshop on running Qwen open-weight models locally,
  building agents, and shipping something you actually use. ROBT407LLM.
lang: en

# just-the-docs gives us a sidebar and search with no vendoring.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Light. The diagrams are drawn with a dark-mode CSS override keyed on
# prefers-color-scheme, so they follow the reader's OS setting either way -
# the page chrome is what this sets.
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true

aux_links:
  "Notebooks on GitHub":
    - "https://github.com/berdakh/ROBT407LLM/tree/master/notebooks"
  "Repository":
    - "https://github.com/berdakh/ROBT407LLM"
aux_links_new_tab: true

nav_external_links:
  - title: Qwen on Hugging Face
    url: https://huggingface.co/Qwen
  - title: Open in Colab
    url: https://colab.research.google.com/github/berdakh/ROBT407LLM

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  ROBT407LLM workshop materials. Code is MIT licensed; prose is CC BY 4.0.
  Model weights are governed by their own licences - check each model card.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
