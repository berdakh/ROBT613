<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"><desc>Bar chart of memory use per model and precision. Weights dominate, but at 32k context the KV cache of an 8-bit 8B model rivals the weights themselves.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><style>@media (prefers-color-scheme: dark) {
  svg .d-bg { fill: #0d1117; }
  svg .d-fg { fill: #e6edf3; }
  svg .d-muted_fg { fill: #8b949e; }
  svg .d-edge { stroke: #30363d; }
  svg .d-edge-a { stroke: #58a6ff; }
  svg .d-head { fill: #30363d; }
  svg .d-head-a { fill: #58a6ff; }
  svg .d-default { fill: #161b22; stroke: #30363d; }
  svg .d-accent { fill: #132e57; stroke: #58a6ff; }
  svg .d-good { fill: #12321f; stroke: #3fb950; }
  svg .d-warn { fill: #3a2d0a; stroke: #d29922; }
  svg .d-bad { fill: #3d1417; stroke: #f85149; }
  svg .d-muted { fill: #161b22; stroke: #30363d; }
  svg .d-ghost { fill: none; stroke: #30363d; }
  svg .d-t-accent { fill: #58a6ff; }
  svg .d-t-good { fill: #3fb950; }
  svg .d-t-warn { fill: #d29922; }
  svg .d-t-bad { fill: #f85149; }
}</style><rect width="880" height="380" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Where the memory goes</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Weights dominate - until your context gets long.</text><text x="30.0" y="104.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Qwen3-0.6B  bf16</text><rect x="210.0" y="84.0" width="14.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="223.2" y="84.0" width="10.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="244.6" y="102.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">~2.6 GB total</text><text x="30.0" y="142.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Qwen3-4B    bf16</text><rect x="210.0" y="122.0" width="88.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="298.0" y="122.0" width="10.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="320.5" y="140.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">~9.5 GB total</text><text x="30.0" y="180.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Qwen3-4B    int4</text><rect x="210.0" y="160.0" width="24.2" height="26.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="234.2" y="160.0" width="10.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="256.7" y="178.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">~3.7 GB total</text><text x="30.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Qwen3-8B    bf16</text><rect x="210.0" y="198.0" width="176.0" height="26.0" rx="3" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="386.0" y="198.0" width="10.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="409.6" y="216.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">~17.6 GB total</text><text x="30.0" y="256.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Qwen3-8B    int4</text><rect x="210.0" y="236.0" width="48.4" height="26.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="258.4" y="236.0" width="10.0" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="282.0" y="254.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">~6.0 GB total</text><text x="30.0" y="294.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Qwen3-8B  int4 @32k ctx</text><rect x="210.0" y="274.0" width="48.4" height="26.0" rx="3" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="258.4" y="274.0" width="49.5" height="26.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="324.9" y="292.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">~9.9 GB total</text><line x1="30.0" y1="330.0" x2="850.0" y2="330.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><rect x="30.0" y="348.0" width="22.0" height="14.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="60.0" y="360.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">weights</text><rect x="160.0" y="348.0" width="22.0" height="14.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="190.0" y="360.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">KV cache - grows with conversation length</text><text x="560.0" y="360.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">every total also includes ~1 GB overhead</text></svg>
