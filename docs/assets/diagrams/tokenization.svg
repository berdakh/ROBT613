<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img"><desc>The word strawberry splits into three tokens: str, aw, berry. The model sees opaque chunks, not letters, which is why letter counting fails and why a tool fixes it.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><style>@media (prefers-color-scheme: dark) {
  svg .d-bg { fill: #0d1117; }
  svg .d-fg { fill: #e6edf3; }
  svg .d-muted_fg { fill: #8b949e; }
  svg .d-edge { stroke: #30363d; }
  svg .d-edge-a { stroke: #58a6ff; }
  svg .d-head { fill: #30363d; }
  svg .d-head-a { fill: #58a6ff; }
  svg .d-default { fill: #161b22; stroke: #30363d; }
  svg .d-accent { fill: #132e57; stroke: #58a6ff; }
  svg .d-good { fill: #12321f; stroke: #3fb950; }
  svg .d-warn { fill: #3a2d0a; stroke: #d29922; }
  svg .d-bad { fill: #3d1417; stroke: #f85149; }
  svg .d-muted { fill: #161b22; stroke: #30363d; }
  svg .d-ghost { fill: none; stroke: #30363d; }
  svg .d-t-accent { fill: #58a6ff; }
  svg .d-t-good { fill: #3fb950; }
  svg .d-t-warn { fill: #d29922; }
  svg .d-t-bad { fill: #f85149; }
}</style><rect width="880" height="300" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">What the model actually sees</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Not letters, not words - tokens. This explains a lot of odd behaviour.</text><text x="30.0" y="96.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">You write:</text><rect x="120.0" y="76.0" width="250.0" height="34.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="245.0" y="97.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">"strawberry"</text><text x="30.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Model sees:</text><rect x="120.0" y="126.0" width="80.0" height="34.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="160.0" y="147.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">str</text><rect x="205.0" y="126.0" width="65.0" height="34.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="237.5" y="147.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">aw</text><rect x="275.0" y="126.0" width="95.0" height="34.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="322.5" y="147.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">berry</text><text x="400.0" y="148.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">3 opaque chunks, not 10 letters</text><text x="30.0" y="206.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">So this fails:</text><rect x="120.0" y="186.0" width="250.0" height="34.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="245.0" y="207.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">"how many r's?"</text><text x="400.0" y="208.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">the letters are not visible to it</text><text x="30.0" y="256.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">And this always works:</text><rect x="180.0" y="236.0" width="190.0" height="34.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="275.0" y="257.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">word.count("r")</text><text x="400.0" y="258.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">a tool -&gt; notebook 07</text><text x="700.0" y="148.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1 token</text><text x="700.0" y="168.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">~4 chars English</text><text x="700.0" y="186.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">~2 chars Kazakh</text></svg>
