<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img"><desc>Quantization stores a group of weights as 4-bit integers plus one shared scale factor, cutting 64 bytes to about 18, with a small reconstruction error.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><style>@media (prefers-color-scheme: dark) {
  svg .d-bg { fill: #0d1117; }
  svg .d-fg { fill: #e6edf3; }
  svg .d-muted_fg { fill: #8b949e; }
  svg .d-edge { stroke: #30363d; }
  svg .d-edge-a { stroke: #58a6ff; }
  svg .d-head { fill: #30363d; }
  svg .d-head-a { fill: #58a6ff; }
  svg .d-default { fill: #161b22; stroke: #30363d; }
  svg .d-accent { fill: #132e57; stroke: #58a6ff; }
  svg .d-good { fill: #12321f; stroke: #3fb950; }
  svg .d-warn { fill: #3a2d0a; stroke: #d29922; }
  svg .d-bad { fill: #3d1417; stroke: #f85149; }
  svg .d-muted { fill: #161b22; stroke: #30363d; }
  svg .d-ghost { fill: none; stroke: #30363d; }
  svg .d-t-accent { fill: #58a6ff; }
  svg .d-t-good { fill: #3fb950; }
  svg .d-t-warn { fill: #d29922; }
  svg .d-t-bad { fill: #f85149; }
}</style><rect width="880" height="300" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">What quantization actually does</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Store a group of weights as small integers plus one shared scale.</text><text x="30.0" y="92.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Original (bf16, 2 bytes each)</text><rect x="30.0" y="104.0" width="88.0" height="34.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="74.0" y="125.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.417</text><rect x="126.0" y="104.0" width="88.0" height="34.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="170.0" y="125.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">-0.203</text><rect x="222.0" y="104.0" width="88.0" height="34.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="266.0" y="125.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.089</text><rect x="318.0" y="104.0" width="88.0" height="34.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="362.0" y="125.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.376</text><rect x="414.0" y="104.0" width="88.0" height="34.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="458.0" y="125.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">-0.311</text><text x="520.0" y="126.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">32 weights = 64 bytes</text><line x1="440.0" y1="150.0" x2="440.0" y2="176.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="455.0" y="170.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">find the group max, divide, round</text><text x="30.0" y="210.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Quantized (int4 + one fp16 scale)</text><rect x="30.0" y="222.0" width="88.0" height="34.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="74.0" y="243.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">7</text><rect x="126.0" y="222.0" width="88.0" height="34.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="170.0" y="243.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">-3</text><rect x="222.0" y="222.0" width="88.0" height="34.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="266.0" y="243.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">1</text><rect x="318.0" y="222.0" width="88.0" height="34.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="362.0" y="243.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">6</text><rect x="414.0" y="222.0" width="88.0" height="34.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="458.0" y="243.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">-5</text><rect x="520.0" y="222.0" width="130.0" height="34.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="585.0" y="243.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">scale 0.0596</text><text x="666.0" y="244.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">32 weights = ~18 bytes</text><text x="30.0" y="286.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Reconstruct with  value = scale x integer.  Close, not identical - that gap is the quality cost.</text></svg>
