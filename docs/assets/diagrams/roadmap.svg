ont-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Day 3</text><text x="548.0" y="130.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Knowledge</text><text x="548.0" y="160.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">08 embeddings</text><text x="548.0" y="182.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">09 RAG</text><text x="548.0" y="204.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">10 agents</text><line x1="638.0" y1="179.0" x2="704.0" y2="179.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><rect x="678.0" y="84.0" width="172.0" height="190.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="764.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Day 4</text><text x="764.0" y="130.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Ship</text><text x="764.0" y="160.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">11 fine-tuning</text><text x=