<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"><desc>Five small loss plots. Healthy: train and validation both fall and flatten together. Undertrained: both still falling at the last step. Overfitting: train keeps falling while validation dips then climbs. Stuck at chance: both flat on the chance-loss line. Diverged: both climb away. In three of the five the train curve alone looks acceptable, so only the validation curve distinguishes them.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="900" height="420" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Five loss curves, five decisions</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Solid blue = train.  Dashed red = validation.  Dotted grey = chance loss.</text><rect x="36.0" y="106.0" width="152.0" height="118.0" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="112.0" y="80.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Healthy</text><text x="112.0" y="97.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">let it run</text><path d="M 42.0 120.5 L 45.5 126.5 L 49.0 132.1 L 52.5 137.2 L 56.0 142.0 L 59.5 146.3 L 63.0 150.4 L 66.5 154.1 L 70.0 157.6 L 73.5 160.7 L 77.0 163.7 L 80.5 166.4 L 84.0 168.9 L 87.5 171.2 L 91.0 173.3 L 94.5 175.3 L 98.0 177.1 L 101.5 178.8 L 105.0 180.3 L 108.5 181.8 L 112.0 183.1 L 115.5 184.3 L 119.0 185.4 L 122.5 186.5 L 126.0 187.4 L 129.5 188.3 L 133.0 189.1 L 136.5 189.9 L 140.0 190.6 L 143.5 191.2 L 147.0 191.8 L 150.5 192.4 L 154.0 192.9 L 157.5 193.3 L 161.0 193.8 L 164.5 194.2 L 168.0 194.5 L 171.5 194.9 L 175.0 195.2 L 178.5 195.5 L 182.0 195.7" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><path d="M 42.0 116.2 L 45.5 121.8 L 49.0 126.9 L 52.5 131.6 L 56.0 136.0 L 59.5 140.1 L 63.0 143.9 L 66.5 147.4 L 70.0 150.7 L 73.5 153.7 L 77.0 156.5 L 80.5 159.1 L 84.0 161.5 L 87.5 163.8 L 91.0 165.9 L 94.5 167.8 L 98.0 169.6 L 101.5 171.2 L 105.0 172.8 L 108.5 174.2 L 112.0 175.5 L 115.5 176.8 L 119.0 177.9 L 122.5 179.0 L 126.0 179.9 L 129.5 180.9 L 133.0 181.7 L 136.5 182.5 L 140.0 183.2 L 143.5 183.9 L 147.0 184.5 L 150.5 185.1 L 154.0 185.6 L 157.5 186.1 L 161.0 186.6 L 164.5 187.0 L 168.0 187.4 L 171.5 187.8 L 175.0 188.1 L 178.5 188.5 L 182.0 188.8" stroke="#cf222e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-bad"/><rect x="212.0" y="106.0" width="152.0" height="118.0" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="288.0" y="80.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Undertrained</text><text x="288.0" y="97.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sa