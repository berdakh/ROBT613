, Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">stop at the dip</text><path d="M 394.0 120.5 L 397.5 129.4 L 401.0 137.4 L 404.5 144.7 L 408.0 151.2 L 411.5 157.2 L 415.0 162.6 L 418.5 167.4 L 422.0 171.8 L 425.5 175.8 L 429.0 179.4 L 432.5 182.7 L 436.0 185.7 L 439.5 188.3 L 443.0 190.8 L 446.5 192.9 L 450.0 194.9 L 453.5 196.7 L 457.0 198.3 L 460.5 199.8 L 464.0 201.1 L 467.5 202.3 L 471.0 203.4 L 474.5 204.4 L 478.0 205.3 L 481.5 206.1 L 485.0 206.8 L 488.5 207.5 L 492.0 208.1 L 495.5 208.6 L 499.0 209.1 L 502.5 209.6 L 506.0 210.0 L 509.5 210.3 L 513.0 210.6 L 516.5 210.9 L 520.0 211.2 L 523.5 211.5 L 527.0 211.7 L 530.5 211.9 L 534.0 212.1" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><path d="M 394.0 120.5 L 397.5 134.8 L 401.0 146.2 L 404.5 155.3 L 408.0 162.6 L 411.5 168.4 L 415.0 173.1 L 418.5 176.8 L 422.0 179.8 L 425.5 182.1 L 429.0 183.4 L 432.5 184.2 L 436.0 184.4 L 439.5 184.3 L 443.0 183.9 L 446.5 183.2 L 450.0 182.4 L 453.5 181.3 L 457.0 180.1 L 460.5 178.8 L 464.0 177.3 L 467.5 175.8 L 471.0 174.2 L 474.5 172.4 L 478.0 170.7 L 481.5 168.8 L 485.0 166.9 L 488.5 164.9 L 492.0 162.9 L 495.5 160.8 L 499.0 158.7 L 502.5 156.6 L 506.0 154.4 L 509.5 152.1 L 513.0 149.8 L 516.5 147.5 L 520.0 145.1 L 523.5 142.7 L 527.0 140.3 L 530.5 137.8 L 534.0 135.3" stroke="#cf222e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-bad"/><rect x="564.0" y="106.0" width="152.0" height="118.0" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="640.0" y="80.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Stuck at chance</text><text x="640.0" y="97.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">it is a bug</text><line x1="570" y1="121.3" x2="710" y2="121.3" stroke="#656d76" stroke-width="1" stroke-dasharray="3 3" class="d-s-muted_fg"/><path d="M 570.0 135.3 L 573.5 135.4 L 577.0 135.4 L 580.5 135.4 L 584.0 135.5 L 587.5 135.5 L 591.0 135.6 L 594.5 135.6 L 598.0 135.6 L 601.5 135.7 L 605.0 135.7 L 608.5 135.8 L 612.0 135.8 L 615.5 135.8 L 619.0 135.9 L 622.5 135.9 L 626.0 136.0 L 629.5 136.0 L 633.0 136.0 L 636.5 136.1 L 640.0 136.1 L 643.5 136.2 L 647.0 136.2 L 650.5 136.2 L 654.0 136.3 L 657.5 136.3 L 661.0 136.4 L 664.5 136.4 L 668.0 136.4 L 671.5 136.5 L 675.0 136.5 L 678.5 136.6 L 682.0 136.6 L 685.5 136.6 L 689.0 136.7 L 692.5 136.7 L 696.0 136.8 L 699.5 136.8 L 703.0 136.8 L 706.5 136.9 L 710.0 136.9" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><path d="M 570.0 133.2 L 573.5 133.2 L 577.0 133.3 L 580.5 133.3 L 584.0 133.3 L 587.5 133.3 L 591.0 133.4 L 594.5 133.4 L 598.0 133.4 L 601.5 133.4 L 605.0 133.5 L 608.5 133.5 L 612.0 133.5 L 615.5 133.5 L 619.0 133.6 L 622.5 133.6 L 626.0 133.6 L 629.5 133.7 L 633.0 133.7 L 636.5 133.7 L 640.0 133.7 L 643.5 133.8 L 647.0 133.8 L 650.5 133.8 L 654.0 133.8 L 657.5 133.9 L 661.0 133.9 L 664.5 133.9 L 668.0 133.9 L 671.5 134.0 L 675.0 134.0 L 678.5 134.0 L 682.0 134.0 L 685.5 134.1 L 689.0 134.1 L 692.5 134.1 L 696.0 134.2 L 699.5 134.2 L 703.0 134.2 L 706.5 134.2 L 710.0 134.3" stroke="#cf222e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-bad"/><text x="640.0" y="114.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">ln(V)</text><rect x="740.0" y="106.0" width="152.0" height="118.0" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="816.0" y="80.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Diverged</text><text x="816.0" y="97.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">lower the LR</text><path d="M 746.0 165.0 L 749.5 165.0 L 753.0 165.0 L 756.5 165.0 L 760.0 165.0 L 763.5 165.0 L 767.0 165.0 L 770.5 165.0 L 774.0 165.0 L 777.5 165.0 L 781.0 165.0 L 784.5 163.8 L 788.0 162.3 L 791.5 160.8 L 795.0 159.3 L 798.5 157.7 L 802.0 156.1 L 805.5 154.4 L 809.0 152.7 L 812.5 151.0 L 816.0 149.3 L 819.5 147.6 L 823.0 145.8 L 826.5 144.1 L 830.0 142.3 L 833.5 140.5 L 837.0 138.7 L 840.5 136.9 L 844.0 135.1 L 847.5 133.2 L 851.0 131.4 L 854.5 129.5 L 858.0 127.7 L 861.5 125.8 L 865.0 123.9 L 868.5 122.0 L 872.0 120.1 L 875.5 118.2 L 879.0 116.3 L 882.5 114.4 L 886.0 112.5" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><path d="M 746.0 160.8 L 749.5 160.8 L 753.0 160.8 L 756.5 160.8 L 760.0 160.8 L 763.5 160.8 L 767.0 160.8 L 770.5 160.8 L 774.0 160.8 L 777.5 160.8 L 781.0 160.8 L 784.5 159.3 L 788.0 157.6 L 791.5 155.9 L 795.0 154.0 L 798.5 152.2 L 802.0 150.2 L 805.5 148.3 L 809.0 146.3 L 812.5 144.3 L 816.0 142.3 L 819.5 140.3 L 823.0 138.2 L 826.5 136.1 L 830.0 134.0 L 833.5 131.9 L 837.0 129.8 L 840.5 127.7 L 844.0 125.5 L 847.5 123.4 L 851.0 121.2 L 854.5 119.0 L 858.0 116.8 L 861.5 114.6 L 865.0 112.4 L 868.5 112.0 L 872.0 112.0 L 875.5 112.0 L 879.0 112.0 L 882.5 112.0 L 886.0 112.0" stroke="#cf222e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-bad"/><line x1="36.0" y1="272.0" x2="864.0" y2="272.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="36.0" y="298.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Read validation, decide on validation.</text><text x="36.0" y="320.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">In the middle three panels the train curve is falling or flat - indistinguishable, at a glance, from the healthy one.</text><text x="36.0" y="340.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Only the dashed line separates "learning" from "memorising" and "stuck". A run logged without a validation set</text><text x="36.0" y="360.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">cannot be diagnosed at all, which is the single most common reason a fine-tune ships broken.</text><text x="36.0" y="392.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Notebook 16 produces all five of these from real training runs, and a diagnose() function that labels them.</text></svg>
